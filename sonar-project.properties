sonar.projectKey=gaelsimon_neos-audio
sonar.organization=gaelsimon
sonar.projectName=Neos
sonar.projectVersion=1.0.2

# Sources & tests
sonar.sources=Neos
sonar.tests=NeosTests,NeosUITests

# Exclusions
sonar.exclusions=**/*.generated.swift,**/Resources/**,**/Mocks/**,**/.build/**,**/build/**,docs/**,scripts/**
sonar.test.exclusions=**/Mocks/**

# Coverage
sonar.coverageReportPaths=coverage-sonar.xml
# SwiftUI view bodies are not meaningfully unit-testable. Counting them would measure how much of
# the code is UI rather than how well the logic behind it is tested.
sonar.coverage.exclusions=Neos/Views/**

# Encoding
sonar.sourceEncoding=UTF-8
