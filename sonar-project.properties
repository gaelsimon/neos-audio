sonar.projectKey=gaelsimon_neos-audio
sonar.organization=gaelsimon
sonar.projectName=Neos

# Sources & tests
sonar.sources=Neos
sonar.tests=NeosTests,NeosUITests

# Exclusions
sonar.exclusions=**/*.generated.swift,**/Resources/**,**/Mocks/**,**/.build/**,**/build/**,docs/**,scripts/**
sonar.test.exclusions=**/Mocks/**

# App coverage is not fed to Sonar; package coverage lives in the swift-heos repo.
sonar.coverage.exclusions=Neos/**

# Encoding
sonar.sourceEncoding=UTF-8
