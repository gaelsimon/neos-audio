sonar.projectKey=gaelsimon_neos-audio
sonar.organization=gaelsimon
sonar.projectName=Neos

# Sources & tests
sonar.sources=Neos
sonar.tests=NeosTests,NeosUITests,NeosMobileUITests

# Exclusions
sonar.exclusions=**/*.generated.swift,**/Resources/**,**/Mocks/**,**/.build/**,**/build/**,docs/**,scripts/**
sonar.test.exclusions=**/Mocks/**

# Coverage
sonar.coverageReportPaths=coverage-sonar.xml
# SwiftUI view bodies are not meaningfully unit-testable. Counting them would measure how much of
# the code is UI rather than how well the logic behind it is tested.
sonar.coverage.exclusions=Neos/Views/**,Neos/App/Demo*.swift

# The URL fields show an example address in their empty state; it is never opened.
sonar.issue.ignore.multicriteria=favoriteURLExample,artworkURLExample
sonar.issue.ignore.multicriteria.favoriteURLExample.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.favoriteURLExample.resourceKey=Neos/Views/Components/AddFavoriteForm.swift
sonar.issue.ignore.multicriteria.artworkURLExample.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.artworkURLExample.resourceKey=Neos/Views/Components/ArtworkChooser.swift

# Encoding
sonar.sourceEncoding=UTF-8
