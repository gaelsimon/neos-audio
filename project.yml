name: Neos
options:
  bundleIdPrefix: com.galela
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

packages:
  swift-heos:
    url: https://github.com/gaelsimon/swift-heos
    minorVersion: 0.2.15

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targetTemplates:
  App:
    type: application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galela.neos
        PRODUCT_NAME: Neos
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.3.0-dev"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "demo-*.jpg CREDITS.md"
    dependencies:
      - package: swift-heos
        product: HEOSKit
      - package: swift-heos
        product: NeosDomain

targets:
  Neos:
    templates: [App]
    platform: macOS
    sources:
      - path: Neos
        excludes:
          - Resources/Info.plist
          - Utilities/iOS
          - Views/iOS
    settings:
      base:
        INFOPLIST_FILE: Neos/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: Neos/Neos.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true

  # The iPhone and iPad app: the same sources as Neos without the macOS folders, plus its own resources.
  NeosMobile:
    templates: [App]
    platform: iOS
    sources:
      - path: Neos
        excludes:
          - Resources/Info.plist
          - Neos.entitlements
          - Utilities/macOS
          - Views/macOS
      - path: NeosMobile
        excludes:
          - Resources/Info.plist
    settings:
      base:
        INFOPLIST_FILE: NeosMobile/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMobile
        # White chrome; views set the orange themselves where something is active.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColorMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"

  NeosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NeosTests
        excludes:
          - iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galela.neos.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Neos

  NeosMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeosTests
        excludes:
          - macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galela.neos.mobiletests
        GENERATE_INFOPLIST_FILE: true
        # The app is named Neos, so the default host path from the target name does not exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Neos.app/Neos"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: NeosMobile

  NeosUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: NeosUITests
      - path: Neos/Utilities/AccessibilityID.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galela.neos.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Neos

  NeosMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NeosMobileUITests
      - path: Neos/Utilities/AccessibilityID.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galela.neos.mobileuitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: NeosMobile
    dependencies:
      - target: NeosMobile

schemes:
  Neos:
    build:
      targets:
        Neos: all
        NeosTests: [test]
        NeosUITests: [test]
    test:
      targets:
        - NeosTests
        - NeosUITests
  NeosUITests:
    build:
      targets:
        Neos: all
        NeosUITests: [test]
    test:
      testPlans:
        - path: NeosIntegrationTests.xctestplan
          defaultPlan: true
        - path: NeosSmokeTests.xctestplan
  NeosMobile:
    build:
      targets:
        NeosMobile: all
        NeosMobileTests: [test]
    test:
      targets:
        - NeosMobileTests
  NeosMobileUITests:
    build:
      targets:
        NeosMobile: all
        NeosMobileUITests: [test]
    test:
      targets:
        - NeosMobileUITests
