name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-build:
    name: App build & lint
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install tools
        run: brew install xcodegen swiftlint xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint --reporter github-actions-logging

      - name: Build app (ad-hoc signed, no archive)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Neos.xcodeproj \
            -scheme Neos \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            | xcbeautify

      - name: App tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Neos.xcodeproj \
            -scheme Neos \
            -destination 'platform=macOS' \
            -only-testing:NeosTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            | xcbeautify

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sonar's own PR comment gives a count and a link. Re-emitting the findings as workflow
      # annotations puts them on the diff, where the reviewer already is.
      - name: Annotate SonarCloud findings
        if: ${{ env.SONAR_TOKEN != '' && github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          TASK_FILE=.scannerwork/report-task.txt
          if [ ! -f "$TASK_FILE" ]; then
            echo "::notice::No scanner report found; skipping annotations."
            exit 0
          fi
          # The scanner uploads and returns; SonarCloud analyses asynchronously, and issues are
          # only queryable once the compute-engine task leaves the queue.
          CE_URL=$(sed -n 's/^ceTaskUrl=//p' "$TASK_FILE")
          STATUS=UNKNOWN
          for _ in $(seq 1 60); do
            STATUS=$(curl -sSf -u "$SONAR_TOKEN:" "$CE_URL" | jq -r '.task.status')
            case "$STATUS" in
              PENDING|IN_PROGRESS) sleep 5 ;;
              *) break ;;
            esac
          done
          echo "Analysis task finished as $STATUS"
          PROJECT=$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties)
          curl -sSf -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=$PROJECT&pullRequest=$PR_NUMBER&issueStatuses=OPEN,CONFIRMED&ps=100" \
            | jq -r '.issues[] | "::warning file=\(.component | sub("^[^:]+:";"")),line=\(.line // 1),title=Sonar \(.rule)::\(.message)"'
