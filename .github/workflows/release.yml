name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v), e.g. 1.6.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install tools
        run: brew install xcodegen

      - name: Derive version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # Semver pre-release: any hyphen suffix (e.g. 1.1.0-beta.1) ships as a prerelease, not Latest.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      # A fork, or this repo before the Developer ID certificate exists, still builds and
      # releases: it just produces an ad-hoc signed DMG, exactly as before.
      - name: Detect signing credentials
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$NOTARY_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID credentials; publishing an unsigned DMG."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for the keychain password and the runner hangs.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build DMG
        env:
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.signed == 'true' && 'Developer ID Application' || '-' }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/notary.p8', runner.temp) || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Compute DMG checksum
        id: checksum
        run: |
          DMG="build/Neos-${{ steps.version.outputs.version }}.dmg"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.checksum.outputs.dmg }}
          SHA: ${{ steps.checksum.outputs.sha256 }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # workflow_dispatch path may need to create the tag itself
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          NOTES_FILE=$(mktemp)
          if [ "$PRERELEASE" = "true" ]; then
            echo "> Beta build for testing. Not a stable release." >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
          fi
          cat >> "$NOTES_FILE" <<EOF
          ## Neos $TAG

          ### Install
          1. Download \`Neos-${VERSION}.dmg\` below
          2. Open the DMG, drag Neos to Applications
          3. First launch (the DMG is unsigned): right-click Neos → Open → Open.
             Alternatively, System Settings → Privacy & Security → Open Anyway,
             or run \`xattr -dr com.apple.quarantine /Applications/Neos.app\`.

          ### Checksum
          \`\`\`
          SHA-256: ${SHA}
          \`\`\`

          ### What's new
          EOF

          FLAGS=(--title "Neos $TAG" --notes-file "$NOTES_FILE" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease --latest=false)
          else
            FLAGS+=(--latest)
          fi
          gh release create "$TAG" "$DMG" "${FLAGS[@]}"
